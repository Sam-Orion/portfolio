<svg width="600" height="400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1e293b;stop-opacity:1" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="600" height="400" fill="url(#grad1)" />
  <circle cx="300" cy="200" r="80" fill="none" stroke="#4ade80" stroke-width="4" filter="url(#glow)" opacity="0.5">
    <animate attributeName="r" values="80;90;80" dur="3s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="0.5;0.8;0.5" dur="3s" repeatCount="indefinite" />
  </circle>
  <path d="M260 220 C 260 180, 290 150, 300 130 C 310 150, 340 180, 340 220" stroke="#4ade80" stroke-width="4" fill="none" stroke-linecap="round" />
  <text x="50%" y="340" dominant-baseline="middle" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" fill="#4ade80" letter-spacing="4">AIRSENSE</text>
</svg>
