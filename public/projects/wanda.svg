<svg width="600" height="400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#312e81;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#4338ca;stop-opacity:1" />
    </linearGradient>
    <filter id="glow2" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="600" height="400" fill="url(#grad2)" />
  
  <!-- Neural Network Connections -->
  <line x1="150" y1="100" x2="300" y2="200" stroke="#818cf8" stroke-width="2" opacity="0.4" />
  <line x1="150" y1="300" x2="300" y2="200" stroke="#818cf8" stroke-width="2" opacity="0.4" />
  <line x1="300" y1="200" x2="450" y2="100" stroke="#818cf8" stroke-width="2" opacity="0.4" />
  <line x1="300" y1="200" x2="450" y2="300" stroke="#818cf8" stroke-width="2" opacity="0.4" />
  
  <!-- Pruned Connections (Dashed) -->
  <line x1="150" y1="200" x2="300" y2="200" stroke="#a5b4fc" stroke-width="2" stroke-dasharray="5,5" opacity="0.3" />
  <line x1="300" y1="200" x2="450" y2="200" stroke="#a5b4fc" stroke-width="2" stroke-dasharray="5,5" opacity="0.3" />

  <!-- Nodes -->
  <circle cx="150" cy="100" r="10" fill="#c7d2fe" />
  <circle cx="150" cy="200" r="10" fill="#6366f1" opacity="0.5" /> <!-- Pruned node -->
  <circle cx="150" cy="300" r="10" fill="#c7d2fe" />
  
  <circle cx="300" cy="200" r="20" fill="#a5b4fc" filter="url(#glow2)">
    <animate attributeName="r" values="20;22;20" dur="4s" repeatCount="indefinite" />
  </circle>
  
  <circle cx="450" cy="100" r="10" fill="#c7d2fe" />
  <circle cx="450" cy="200" r="10" fill="#6366f1" opacity="0.5" /> <!-- Pruned node -->
  <circle cx="450" cy="300" r="10" fill="#c7d2fe" />

  <text x="50%" y="350" dominant-baseline="middle" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" fill="#e0e7ff" letter-spacing="4" font-weight="bold">WANDA-PYTHON</text>
  <text x="50%" y="375" dominant-baseline="middle" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#a5b4fc" letter-spacing="2">MODEL PRUNING</text>
</svg>
