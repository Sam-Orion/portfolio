<svg width="600" height="400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#18181b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#27272a;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>
  <rect width="600" height="400" fill="url(#bg-grad)" />
  
  <!-- YT Music Side -->
  <circle cx="200" cy="200" r="60" fill="#ef4444" filter="url(#shadow)" opacity="0.9" />
  <path d="M185 175 L225 200 L185 225 Z" fill="white" />
  
  <!-- Spotify Side -->
  <circle cx="400" cy="200" r="60" fill="#1db954" filter="url(#shadow)" opacity="0.9" />
  <path d="M375 200 C385 195, 415 195, 425 200 M370 185 C385 175, 420 175, 430 185 M380 215 C388 212, 412 212, 420 215" stroke="white" stroke-width="5" stroke-linecap="round" fill="none" opacity="0.9"/>

  <!-- Transfer Arrows -->
  <path d="M270 180 L330 180 M320 170 L330 180 L320 190" stroke="#fbbf24" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <animate attributeName="stroke-dasharray" values="0,60;60,0;0,60" dur="2s" repeatCount="indefinite" />
  </path>
  <path d="M330 220 L270 220 M280 230 L270 220 L280 210" stroke="#fbbf24" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.3">
  </path>

  <text x="50%" y="340" dominant-baseline="middle" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#e4e4e7" letter-spacing="2" font-weight="bold">PLAYLIST MIGRATOR</text>
</svg>
